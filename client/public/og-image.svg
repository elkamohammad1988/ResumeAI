<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00d96f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d96f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(80,90)">
    <rect width="56" height="56" rx="12" fill="#00d96f"/>
    <g transform="translate(16,16)" stroke="#0a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 0H7a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8z"/>
      <path d="M14 0v8h8"/>
      <path d="m9 16 2 2 4-4"/>
    </g>
    <text x="76" y="38" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#ffffff">
      Resume<tspan fill="#00d96f">AI</tspan>
    </text>
  </g>

  <!-- Headline -->
  <text x="80" y="290" font-family="Inter, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">
    The resume that gets
  </text>
  <text x="80" y="380" font-family="Inter, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">
    you the <tspan fill="#00d96f">interview.</tspan>
  </text>

  <!-- Subline -->
  <text x="80" y="450" font-family="Inter, sans-serif" font-size="28" font-weight="400" fill="#a1a1aa">
    AI-tuned · ATS-ready · 4 templates · 3 languages
  </text>

  <!-- Tag chips at bottom -->
  <g transform="translate(80,520)" font-family="Inter, sans-serif" font-size="18" font-weight="600">
    <rect width="120" height="40" rx="20" fill="#00d96f"/>
    <text x="60" y="26" text-anchor="middle" fill="#0a0a0a">FREE</text>

    <rect x="140" width="180" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="230" y="26" text-anchor="middle" fill="#ffffff">No credit card</text>

    <rect x="340" width="220" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="450" y="26" text-anchor="middle" fill="#ffffff">Powered by Gemini 2.5</text>
  </g>
</svg>
